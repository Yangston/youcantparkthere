name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test development tools and preview semantics
        run: |
          python -B -m unittest discover -s scripts/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test preview/tests/logic.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check preview/app.js
  watch:
    needs: portable
    strategy:
      fail-fast: false
      matrix:
        profile: [compact, large]
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Install project generator
        run: brew install xcodegen
      - name: Test CI helper scripts
        id: helpers
        run: |
          set -o pipefail
          mkdir -p build
          python3 -m unittest discover -s scripts/tests -v 2>&1 | tee build/helper-tests.log
      - name: Test station logic and routes
        id: core
        run: |
          set -o pipefail
          swift test 2>&1 | tee build/tests.log
      - name: Generate app assets and project
        run: |
          python3 -m py_compile scripts/*.py
          python3 scripts/make_assets.py
          xcodegen generate
      - name: Build watch simulator and widgets
        id: compile
        run: |
          set -o pipefail
          xcodebuild -project YouCantParkThere.xcodeproj -scheme ParkWatch \
            -configuration Debug -sdk watchsimulator \
            -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee build/watch-build.log
      - name: Validate unsigned distribution archive
        id: archive
        run: |
          set -o pipefail
          xcodebuild -project YouCantParkThere.xcodeproj -scheme ParkDistribution \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/YouCantParkThere.xcarchive CODE_SIGNING_ALLOWED=NO archive \
            2>&1 | tee build/archive.log
          python3 scripts/check_archive.py build/YouCantParkThere.xcarchive
      - name: Check operator's live feed separately from deterministic tests
        id: feed
        continue-on-error: true
        run: |
          set -o pipefail
          swift run ParkFeedCheck 2>&1 | tee build/live-feed.log
      - name: Launch paired simulator and assert in-app routes
        id: smoke
        run: |
          set -o pipefail
          python3 scripts/simulator_smoke.py --profile "${{ matrix.profile }}" 2>&1 | tee build/simulator-smoke.log
      - name: Write readable check summary
        if: always()
        env:
          HELPERS: ${{ steps.helpers.outcome }}
          CORE: ${{ steps.core.outcome }}
          COMPILE: ${{ steps.compile.outcome }}
          ARCHIVE: ${{ steps.archive.outcome }}
          FEED: ${{ steps.feed.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
        run: |
          python3 - <<'PY'
          import os
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('## What this run checked\n\n| Check | Result |\n|---|---|\n')
              for key, label in [('HELPERS','CI helper tests'),('CORE','Portable Swift tests'),('COMPILE','Watch + widget compilation'),('ARCHIVE','Unsigned packaging'),('FEED','Live feed (diagnostic)'),('SMOKE','Paired simulator launch + in-app route state')]:
                  f.write(f'| {label} | {os.environ.get(key, "not run")} |\n')
              f.write('\nSimulator routing calls the production handler through a simulator-only test hook. It does not prove OS delivery from a real complication.\n\nSigning, TestFlight upload, physical-watch GPS, and wrist-raise behavior are separate checks. See docs/SETUP.md and docs/DEVICE_TESTS.md.\n')
          PY
      - name: Save logs, screenshots, state reports, and simulator app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watch-build-${{ matrix.profile }}
          path: |
            build/*.log
            build/*.png
            build/demo-*.json
            build/preview-*.json
            build/capture.json
            build/DerivedData/Build/Products/Debug-watchsimulator/*.app
          if-no-files-found: ignore
          retention-days: 14

      - name: Build native preview report (including partial failures)
        if: always()
        env:
          HELPERS: ${{ steps.helpers.outcome }}
          CORE: ${{ steps.core.outcome }}
          COMPILE: ${{ steps.compile.outcome }}
          ARCHIVE: ${{ steps.archive.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
        run: python3 scripts/preview_report.py
      - name: Save offline preview studio
        id: preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watch-preview-${{ matrix.profile }}
          path: build/preview/
          if-no-files-found: error
          retention-days: 30
      - name: Link preview from run summary
        if: always()
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.artifact-url }}
          PROFILE: ${{ matrix.profile }}
        run: |
          echo "### Native preview: $PROFILE" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download preview studio]($PREVIEW_URL). Extract the ZIP and open index.html. Includes source commit, state assertions, screenshots, and baseline comparison." >> "$GITHUB_STEP_SUMMARY"
          echo "Preview only: no signing, no TestFlight upload, no Watch installation." >> "$GITHUB_STEP_SUMMARY"
