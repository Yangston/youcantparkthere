name: YouCantParkThere
options:
  minimumXcodeGenVersion: 2.42.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    PARK_BUNDLE_ID: com.yangston.youcantparkthere
    CODE_SIGN_STYLE: Automatic
packages:
  ParkCore:
    path: .
targets:
  ParkWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: WatchApp
    dependencies:
      - package: ParkCore
      - target: ParkWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PARK_BUNDLE_ID).watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
    info:
      path: Generated/Watch-Info.plist
      properties:
        CFBundleDisplayName: You Can't Park There
        WKApplication: true
        WKWatchOnly: true
        NSLocationWhenInUseUsageDescription: Find nearby Bike Share Toronto stations and keep the dock map centered during a ride you start.
        NSMotionUsageDescription: Detect cycling while this app is running so it can switch to the parking map. Motion data stays on your watch.
        UIBackgroundModes: [location]
        CFBundleURLTypes:
          - CFBundleURLName: com.yangston.youcantparkthere
            CFBundleURLSchemes: [youcantparkthere]
        ITSAppUsesNonExemptEncryption: false
  ParkWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Widgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PARK_BUNDLE_ID).watchkitapp.widgets
        TARGETED_DEVICE_FAMILY: "4"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Generated/Widgets-Info.plist
      properties:
        CFBundleDisplayName: Find a Dock
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  ParkContainer:
    type: application.watchapp2-container
    platform: iOS
    deploymentTarget: "17.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PARK_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: NO
    info:
      path: Generated/Container-Info.plist
      properties:
        CFBundleDisplayName: You Can't Park There
        ITSWatchOnlyContainer: true
        LSApplicationLaunchProhibited: true
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - target: ParkWatch
        embed: true
schemes:
  ParkWatch:
    build:
      targets:
        ParkWatch: all
  ParkDistribution:
    build:
      targets:
        ParkContainer: all
    archive:
      config: Release
